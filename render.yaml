services:
  - type: web
    name: pakka-engine
    runtime: python
    plan: free
    rootDir: pakka
    buildCommand: pip install -e .
    startCommand: uvicorn pakka.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: PAKKA_ALLOWED_ORIGINS
        sync: false
